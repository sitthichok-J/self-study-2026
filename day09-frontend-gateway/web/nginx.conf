server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # หมายเหตุ: ถ้า location ไหนมี add_header เอง header ระดับ server ข้างบนจะไม่ถูกสืบทอด
  # จึงต้องใส่ security header ซ้ำในทุก location ที่มี add_header (ตรวจโดย tests/test_infra.py)

  # ไฟล์ใน /assets มี hash ในชื่อ แคชได้ยาว
  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: path ที่ไม่ใช่ไฟล์ส่ง index.html ให้ vue-router จัดการ (ห้ามแคช เพื่อให้ได้ asset hash ล่าสุด)
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
