# ต่อยอด backend ของ Day 8: ดึง compose เดิม (postgres, valkey, kafka, api, worker) มารวม
# แล้วเพิ่ม gateway (Kong) กับ web (nginx) ต้องใช้ Docker Compose 2.20 ขึ้นไป (include)
include:
  - path: ../day08-backend/docker-compose.yml
    project_directory: ../day08-backend

name: day09

services:
  gateway:
    image: kong:3.9.1
    depends_on:
      api: { condition: service_started }
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_NGINX_WORKER_PROCESSES: "1"
    volumes: ["./gateway/kong.yml:/kong/kong.yml:ro"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: http://localhost:8000/api
    depends_on:
      gateway: { condition: service_healthy }
    ports: ["3000:8080"]
    restart: unless-stopped
