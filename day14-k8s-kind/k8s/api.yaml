apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: claims, labels: { app: api } }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: claims-api:day14
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: api-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: db, key: url } }
            - name: DEMO_PASSWORD
              valueFrom: { secretKeyRef: { name: app, key: demo-password } }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { memory: 128Mi } }
          volumeMounts: [{ name: jwt-keys, mountPath: /keys, readOnly: true }]
      volumes: [{ name: jwt-keys, secret: { secretName: jwt-keys } }]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: claims }
spec:
  selector: { app: api }
  ports: [{ port: 8080 }]
