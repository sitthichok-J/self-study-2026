# ConfigMap "kong-config" สร้างจาก .work/kong.yml ที่ scripts/render_kong.py ทำจากเทมเพลตของ Day 13 (มีแต่ public key ไม่มี private key)
# Kong ที่นี่ฟัง HTTP :8000 อย่างเดียว ไม่เปิด TLS และไม่เปิด Admin API เพราะรันในเครื่องตัวเองเท่านั้น
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: claims, labels: { app: gateway } }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      enableServiceLinks: false
      containers:
        - name: kong
          image: kong:3.9.1
          env:
            - { name: KONG_DATABASE, value: "off" }
            - { name: KONG_DECLARATIVE_CONFIG, value: /kong/kong.yml }
            - { name: KONG_PROXY_LISTEN, value: "0.0.0.0:8000" }
            - { name: KONG_ADMIN_LISTEN, value: "off" }
            - { name: KONG_PROXY_ACCESS_LOG, value: /dev/stdout }
            - { name: KONG_PROXY_ERROR_LOG, value: /dev/stderr }
            - { name: KONG_NGINX_WORKER_PROCESSES, value: "1" }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            exec: { command: ["kong", "health"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["kong", "health"] }
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts: [{ name: config, mountPath: /kong, readOnly: true }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
      volumes: [{ name: config, configMap: { name: kong-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: claims }
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ port: 8000, targetPort: 8000, nodePort: 30080 }]
