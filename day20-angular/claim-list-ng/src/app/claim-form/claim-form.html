<section>
  <a routerLink="/claims" class="back">← กลับไปรายการ</a>
  <h2>สร้างเคลมใหม่</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="patient_ref">patient_ref</label>
      <input id="patient_ref" formControlName="patient_ref" placeholder="FAKE-AB12" autocomplete="off" />
      @if (fieldError('patient_ref'); as msg) {
        <p class="field-error" data-field="patient_ref">{{ msg }}</p>
      }
    </div>

    <div class="field">
      <label for="amountBaht">ยอดเงิน (บาท)</label>
      <input id="amountBaht" type="number" step="0.01" formControlName="amountBaht" placeholder="1500" />
      @if (fieldError('amountBaht'); as msg) {
        <p class="field-error" data-field="amountBaht">{{ msg }}</p>
      }
    </div>

    @if (serverError(); as msg) {
      <p class="server-error">{{ msg }}</p>
    }

    <button type="submit" class="submit" [disabled]="submitting()">
      {{ submitting() ? 'กำลังส่ง...' : 'ส่งเคลม' }}
    </button>
  </form>
</section>
