# ค่าสำหรับลองใน kind เท่านั้น งานจริงห้ามเก็บ secret ใน repo (ใช้ sealed-secrets / external-secrets / CI variables)
apiVersion: v1
kind: Secret
metadata:
  name: claims-db
type: Opaque
stringData:
  POSTGRES_USER: claims
  POSTGRES_PASSWORD: claims
  POSTGRES_DB: claims
  DATABASE_URL: postgres://claims:claims@postgres:5432/claims?sslmode=disable
