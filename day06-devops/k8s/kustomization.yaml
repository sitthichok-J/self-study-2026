apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claims
resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - postgres.yaml
  - api.yaml
configMapGenerator:
  - name: postgres-initdb
    files:
      - initdb/001_create_claims.sql
generatorOptions:
  disableNameSuffixHash: true
