# รัน api + postgres: docker compose up --build
name: claims
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claims}
      POSTGRES_DB: claims
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ไฟล์ใน initdb จะรันเฉพาะตอนสร้าง DB ครั้งแรก (volume ว่าง)
      - ../day05-go-service/migrations/000001_create_claims.up.sql:/docker-entrypoint-initdb.d/001_create_claims.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../day05-go-service
      dockerfile: ../day06-devops/Dockerfile
    image: claims-api:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADDR: ":8080"
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 10s
      DATABASE_URL: postgres://claims:${POSTGRES_PASSWORD:-claims}@db:5432/claims?sslmode=disable
    ports:
      - "8080:8080"
    restart: unless-stopped
    stop_grace_period: 15s   # มากกว่า SHUTDOWN_TIMEOUT เพื่อให้ graceful shutdown จบก่อนถูก kill

volumes:
  pgdata:
