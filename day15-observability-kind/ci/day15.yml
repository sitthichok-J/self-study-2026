# วางที่ <repo>/.github/workflows/day15.yml (GitHub อ่านเฉพาะที่ root ของ repo) ไฟล์ใน ci/ ของโฟลเดอร์ Day 15 เป็นสำเนาไว้ให้เทสต์ static ตรวจ
# ไม่มี secret ในไฟล์นี้ รหัส admin ของ Grafana สุ่มใหม่ทุกรอบ อยู่เฉพาะใน cluster ชั่วคราวของ runner
name: day15
on:
  push:
    branches: [main]
    paths: ["day15-observability-kind/**", "day14-k8s-kind/**", "day13-revocation-ui-cicd/**", ".github/workflows/day15.yml"]
  pull_request:
    paths: ["day15-observability-kind/**", ".github/workflows/day15.yml"]

permissions:
  contents: read

concurrency:
  group: day15-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: day15-observability-kind
  PROM_IMAGE: prom/prometheus:v2.55.1

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: python -m unittest discover -s day15-observability-kind/tests -v
      # promtool อยู่ใน image ของ Prometheus (ตัวเดียวกับที่ใช้ใน cluster) ตรวจ config, ตรวจ rule และรันเทสต์ alert
      - name: promtool check config
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/${APP}/k8s/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          -v "$PWD/day13-revocation-ui-cicd/deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
          "$PROM_IMAGE" check config /etc/prometheus/prometheus.yml
      - name: promtool check rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/day13-revocation-ui-cicd/deploy/prometheus/alerts.yml:/t/alerts.yml:ro"
          "$PROM_IMAGE" check rules /t/alerts.yml
      - name: promtool test rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/day13-revocation-ui-cicd/deploy/prometheus/alerts.yml:/t/alerts.yml:ro"
          -v "$PWD/${APP}/promtool/tests.yml:/t/tests.yml:ro"
          "$PROM_IMAGE" test rules /t/tests.yml

  kind:
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: claim
          config: day14-k8s-kind/kind-config.yaml
      - name: ระบบของ Day 14 (build, deploy และ smoke)
        run: python day14-k8s-kind/scripts/kindctl.py all
      - name: ติดตั้ง Prometheus + Grafana แล้วตรวจว่าเห็น metrics จริง
        run: python day15-observability-kind/scripts/obsctl.py all
      - name: สถานะเมื่อล้ม
        if: failure()
        run: |
          kubectl -n claims get pods
          kubectl -n claims get events --field-selector type=Warning --sort-by=.lastTimestamp | tail -15
          for d in prometheus grafana; do echo "== $d"; kubectl -n claims logs deploy/$d --tail=25 2>&1 | cut -c1-220 || true; done
          echo "== targets"; kubectl -n claims exec deploy/prometheus -- wget -qO- http://localhost:9090/api/v1/targets 2>&1 | cut -c1-600 || true
