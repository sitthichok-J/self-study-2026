# เหมือน deploy/prometheus/prometheus.yml ของ Day 13 ต่างแค่ target (ใน cluster ใช้ Service api-metrics / worker-metrics)
# ชื่อ job ต้องเหมือนเดิม เพราะ alerts.yml ของ Day 13 อ้าง up{job="claims-api"}
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: claims-api
    static_configs:
      - targets: ["api-metrics:9090"]
  - job_name: claims-worker
    static_configs:
      - targets: ["worker-metrics:9090"]
